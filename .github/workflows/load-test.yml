name: Load Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
      base_url:
        description: 'Override target URL (leave blank to use RAILWAY_APP_URL secret)'
        required: false
        type: string

jobs:
  load-test:
    name: k6 ${{ github.event.inputs.test_type }} test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set target URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            echo "RAILWAY_APP_URL=${{ github.event.inputs.base_url }}" >> $GITHUB_ENV
          else
            echo "RAILWAY_APP_URL=${{ secrets.RAILWAY_APP_URL }}" >> $GITHUB_ENV
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run ${{ github.event.inputs.test_type }} test
        run: |
          k6 run \
            --out json=results.json \
            load-tests/${{ github.event.inputs.test_type }}.js
        env:
          RAILWAY_APP_URL: ${{ env.RAILWAY_APP_URL }}

      - name: Summarise results
        if: always()
        run: |
          echo "## k6 ${{ github.event.inputs.test_type }} test results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** \`${{ env.RAILWAY_APP_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f results.json ]; then
            # Extract key metrics from the JSON output
            VUS=$(jq -r 'select(.type=="Point" and .metric=="vus") | .data.value' results.json | tail -1)
            REQ_COUNT=$(jq -r 'select(.type=="Metric" and .metric=="http_reqs") | .data.contains.count' results.json | tail -1)
            FAIL_RATE=$(jq -r 'select(.type=="Point" and .metric=="http_req_failed") | .data.value' results.json \
              | awk '{sum+=$1; n++} END {if(n>0) printf "%.4f", sum/n; else print "N/A"}')

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Peak VUs | ${VUS:-N/A} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failure rate | ${FAIL_RATE:-N/A} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "_No results file generated (test may have failed to start)._" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ github.event.inputs.test_type }}-results-${{ github.run_id }}
          path: results.json
          retention-days: 30
